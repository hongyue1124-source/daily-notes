<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<!-- 让 iOS「添加到主屏幕」后以独立 App 模式启动（无地址栏） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="行业笔记">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1E5D4B">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
html{color-scheme:light dark}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>每日行业笔记</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --paper:#FBFAF5; --surface:#FFFFFF; --surface-2:#F4F2E9;
  --ink:#16211C; --ink-soft:#46564E; --muted:#7A887F;
  --rule:#DBD8CB; --hair:#E9E6DB;
  --accent:#1E5D4B; --accent-ink:#1E5D4B; --accent-bg:#E6EFEA; --on-accent:#F4F8F5;
  --warn:#7A5C15; --warn-bg:#F6F0DC; --warn-rule:#CBB273;
  --shadow:0 1px 2px rgba(22,33,28,.06),0 8px 24px rgba(22,33,28,.08);
  --serif:'Newsreader','Songti SC','Noto Serif CJK SC','Source Han Serif SC','STSong',Georgia,serif;
  --mono:'IBM Plex Mono','PingFang SC','Microsoft YaHei',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,system-ui,sans-serif;
  --fs:17px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1411; --surface:#161E1A; --surface-2:#1B2520;
    --ink:#E9EDE7; --ink-soft:#B0BEB6; --muted:#7F8E85;
    --rule:#2B3730; --hair:#222E28;
    --accent:#6FC3A0; --accent-ink:#8FD5B7; --accent-bg:#16261F; --on-accent:#0C1512;
    --warn:#D9B45F; --warn-bg:#221C0F; --warn-rule:#4C3E1D;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.34);
  }
}
:root[data-theme="dark"]{
  --paper:#0E1411; --surface:#161E1A; --surface-2:#1B2520;
  --ink:#E9EDE7; --ink-soft:#B0BEB6; --muted:#7F8E85;
  --rule:#2B3730; --hair:#222E28;
  --accent:#6FC3A0; --accent-ink:#8FD5B7; --accent-bg:#16261F; --on-accent:#0C1512;
  --warn:#D9B45F; --warn-bg:#221C0F; --warn-rule:#4C3E1D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.34);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--serif); font-size:var(--fs); line-height:1.8;
  overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}

/* ── app shell ───────────────────────── */
#app{max-width:640px;margin:0 auto;padding:0 0 calc(74px + var(--safe-b))}
.screen{display:none;animation:fade .18s ease}
.screen.on{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}

.topbar{
  position:sticky;top:0;z-index:30;background:var(--paper);
  padding:calc(var(--safe-t) + 14px) 20px 10px;
  border-bottom:1px solid var(--hair);
  display:flex;align-items:baseline;gap:10px;
}
.topbar h1{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent-ink);margin:0}
.topbar .sub{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--muted);margin-left:auto}

.pad{padding:20px}

/* ── cards ───────────────────────────── */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  box-shadow:var(--shadow);overflow:hidden}
.card + .card{margin-top:16px}

.hero{padding:22px 20px 20px}
.eyebrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin-bottom:14px}
.chip{border:1px solid var(--rule);padding:2px 8px;border-radius:2px;color:var(--ink);letter-spacing:.1em}
.chip.acc{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-bg)}
.hero h2{font-size:34px;line-height:1.12;font-weight:600;letter-spacing:-.015em;margin:0 0 12px;text-wrap:balance}
.hero .deck{font-size:16px;line-height:1.7;color:var(--ink-soft);margin:0 0 20px}
.hero .deck b{color:var(--ink);font-weight:600}

.btnrow{display:flex;gap:10px;align-items:center}
.btn{flex:1;min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:var(--on-accent);border-radius:3px;
  font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em}
.btn:active{opacity:.85}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--accent);flex:0 0 auto;padding:0 16px}

.ring{width:34px;height:34px;flex:0 0 auto;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:var(--hair)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dasharray .4s ease}
.ringwrap{position:relative;display:grid;place-items:center}
.ringwrap span{position:absolute;font-family:var(--mono);font-size:9px;color:var(--muted)}

.mini{padding:18px 20px}
.mini .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent-ink);margin-bottom:10px}
.mini p{margin:0;font-size:16px;line-height:1.75;color:var(--ink-soft)}
.quote{background:var(--accent);color:var(--on-accent)}
.quote .lbl{color:var(--on-accent);opacity:.7}
.quote p{color:var(--on-accent);font-size:17px;font-weight:500;line-height:1.7}

/* ── issue list ──────────────────────── */
.searchwrap{padding:14px 20px 4px}
.search{width:100%;min-height:44px;background:var(--surface-2);border:1px solid var(--rule);
  border-radius:3px;padding:0 14px;font-family:var(--sans);font-size:15px;color:var(--ink)}
.search::placeholder{color:var(--muted)}
.monthlbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);padding:22px 20px 8px}
.row{display:grid;grid-template-columns:38px 1fr auto;gap:14px;align-items:start;
  padding:16px 20px;border-top:1px solid var(--hair);width:100%;text-align:left}
.row:active{background:var(--surface-2)}
.row .no{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent-ink);padding-top:4px}
.row .ttl{font-size:19px;font-weight:600;line-height:1.35;margin-bottom:5px}
.row .meta{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);
  display:flex;gap:9px;flex-wrap:wrap;align-items:center;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 auto;margin-top:9px}
.dot.done{background:transparent;border:1px solid var(--rule)}
.empty{padding:56px 20px;text-align:center;color:var(--muted);font-size:15px}
/* 英语「往期」的折叠行：表达 + 类型 + 中文意思副行（最多两行） */
.row .eexp{display:block;font-family:var(--mono);font-size:16.5px;font-weight:600;line-height:1.35;
  letter-spacing:-.01em;margin-bottom:7px;word-break:break-word}
.row .sub{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;
  font-size:14px;line-height:1.6;color:var(--ink-soft);margin-top:8px}
.row .star{width:30px;height:30px;font-size:13px;margin-top:2px}

/* ── glossary ────────────────────────── */
.segs{display:flex;gap:0;margin:14px 20px 0;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.segs button{flex:1;min-height:40px;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;
  color:var(--muted);text-transform:uppercase}
.segs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}

.gitem{padding:16px 20px;border-top:1px solid var(--hair);display:grid;
  grid-template-columns:1fr auto;gap:12px;align-items:start;width:100%;text-align:left}
.gitem:active{background:var(--surface-2)}
.gitem .zh{font-size:18px;font-weight:600}
.gitem .en{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--accent-ink);
  display:block;margin:3px 0 6px}
.gitem .def{font-size:14.5px;line-height:1.7;color:var(--ink-soft)}
.star{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--rule);
  border-radius:3px;font-size:14px;color:var(--muted);flex:0 0 auto}
.star.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink)}

/* ── settings ────────────────────────── */
.set{padding:16px 20px;border-top:1px solid var(--hair);display:flex;align-items:center;
  justify-content:space-between;gap:16px;width:100%;text-align:left}
.set .k{font-size:16px}
.set .v{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.sizes{display:flex;gap:8px}
.sizes button{width:40px;height:36px;border:1px solid var(--rule);border-radius:3px;
  font-family:var(--mono);font-size:12px;color:var(--muted)}
.sizes button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin:0 20px}
.stat div{background:var(--surface);padding:16px 10px;text-align:center}
.stat .n{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--accent-ink);
  font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-top:5px}
.howto{margin:20px;padding:18px 20px;background:var(--accent-bg);border:1px solid var(--accent);border-radius:3px}
.howto .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent-ink);margin-bottom:12px}
.howto ol{margin:0;padding-left:1.2em;font-size:15px;line-height:1.8;color:var(--ink-soft)}
.howto li{margin-bottom:6px}
.howto li::marker{color:var(--accent-ink);font-family:var(--mono);font-size:12px}

/* ── bottom tab bar ──────────────────── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--paper);border-top:1px solid var(--rule);
  padding-bottom:var(--safe-b);
  display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;margin:0 auto}
.tab{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted)}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;
  stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent-ink)}
.tab .badge{position:absolute;transform:translate(14px,-11px);width:6px;height:6px;border-radius:50%;
  background:var(--accent)}

/* ── reader ──────────────────────────── */
#reader{position:fixed;inset:0;z-index:60;background:var(--paper);overflow-y:auto;
  -webkit-overflow-scrolling:touch;display:none}
#reader.on{display:block;animation:slide .24s cubic-bezier(.2,.7,.3,1)}
@keyframes slide{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.rbar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--hair);
  padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
.rbar .x{width:40px;height:40px;display:grid;place-items:center;font-family:var(--mono);font-size:20px;
  color:var(--ink-soft);margin-left:-8px}
.rbar .id{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.rbar .act{margin-left:auto;display:flex;gap:6px}
.rbar .act button{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--rule);
  border-radius:3px;font-size:15px;color:var(--muted)}
.rbar .act button.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent-ink)}
.prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0;transition:width .15s linear}

.rbody{max-width:640px;margin:0 auto;padding:26px 20px 90px}
.rhead{border-bottom:1px solid var(--rule);padding-bottom:22px;margin-bottom:8px}
.rhead h2{font-size:38px;line-height:1.08;font-weight:600;letter-spacing:-.02em;margin:0 0 14px;text-wrap:balance}
.rhead .deck{font-size:17px;line-height:1.72;color:var(--ink-soft);margin:0}
.rhead .deck b{color:var(--ink);font-weight:600}
.rhead h2.eng{font-family:var(--mono);font-size:27px;line-height:1.28;letter-spacing:-.01em;
  word-break:break-word}

.sec{padding-top:34px}
.sechd{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.sechd .n{font-family:var(--mono);font-size:19px;font-weight:500;color:var(--accent-ink)}
.sechd .t{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sec h3{font-size:25px;font-weight:600;line-height:1.28;margin:0 0 18px;letter-spacing:-.01em;text-wrap:balance}
.sec h4{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);margin:30px 0 12px}
.sec p{margin:0 0 18px;line-height:1.85}
.sec ul,.sec ol{margin:0 0 18px;padding-left:1.25em}
.sec li{margin-bottom:10px;line-height:1.8}
.sec li::marker{color:var(--accent-ink)}
.sec b,.sec strong{font-weight:600}
.sec em{font-style:italic}
.sec code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);
  border:1px solid var(--hair);padding:1px 5px;border-radius:2px}

.term{border-bottom:1px dashed var(--accent);color:var(--accent-ink);font-weight:500;padding:0 1px}
.term:active{background:var(--accent-bg)}

.flag{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;
  color:var(--accent-ink);background:var(--accent-bg);border:1px solid var(--accent);
  padding:1px 6px;margin-right:6px;vertical-align:2px;white-space:nowrap;border-radius:2px}

.tbl{overflow-x:auto;margin:22px -20px;padding:0 20px;-webkit-overflow-scrolling:touch}
.tbl table{width:100%;min-width:440px;border-collapse:collapse;border-top:2px solid var(--ink);
  border-bottom:2px solid var(--ink)}
.tbl caption{caption-side:top;text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);padding-bottom:8px}
.tbl th,.tbl td{text-align:left;padding:9px 12px 9px 0;border-bottom:1px solid var(--hair);
  font-size:14px;line-height:1.5;vertical-align:baseline}
.tbl thead th{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);border-bottom:1px solid var(--rule)}
.tbl td.n{font-family:var(--mono);font-size:12.5px;font-weight:500;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.tbl td.s{font-family:var(--mono);font-size:10px;color:var(--muted);padding-right:0}
.up{color:var(--accent-ink)} .dn{color:var(--warn)}

.risk{background:var(--warn-bg);border:1px solid var(--warn-rule);border-left:4px solid var(--warn);
  padding:20px 20px 4px;margin:26px 0;border-radius:2px}
.risk .lbl{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--warn);margin-bottom:12px}
.risk ol{padding-left:1.1em}
.risk li{font-size:15.5px}

.tkw{background:var(--accent);color:var(--on-accent);padding:26px 22px;margin:20px 0;border-radius:2px}
.tkw .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  opacity:.72;margin-bottom:14px}
.tkw p{font-size:19px;line-height:1.65;font-weight:500;margin:0}

.watch{border-top:1px solid var(--hair);padding:16px 0;display:grid;grid-template-columns:30px 1fr;gap:14px}
.watch:last-of-type{border-bottom:1px solid var(--hair)}
.watch .n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent-ink);padding-top:4px}
.watch h5{margin:0 0 5px;font-size:17px;font-weight:600;line-height:1.4}
.watch p{margin:0;font-size:15px;color:var(--ink-soft);line-height:1.7}

.srcs{margin-top:34px;border-top:3px double var(--rule);padding-top:26px}
.srcs h4{margin-top:0}
.srcs a{display:block;padding:12px 0;border-top:1px solid var(--hair);font-size:14.5px;
  line-height:1.55;color:var(--ink);text-decoration:none}
.srcs a .d{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:block;margin-bottom:3px;
  letter-spacing:.05em}
.srcs a .nm{color:var(--accent-ink);border-bottom:1px solid var(--rule)}

.endcard{margin-top:30px;padding:20px;border:1px solid var(--rule);background:var(--surface-2);border-radius:3px}
.endcard .lbl{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--accent-ink);margin-bottom:10px}
.endcard p{margin:0;font-size:15px;color:var(--ink-soft);line-height:1.75}

/* ── term sheet ──────────────────────── */
#veil{position:fixed;inset:0;z-index:70;background:rgba(10,16,13,.44);display:none}
#veil.on{display:block;animation:fade .16s ease}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);
  border-top:1px solid var(--rule);border-radius:10px 10px 0 0;
  padding:22px 22px calc(26px + var(--safe-b));max-width:640px;margin:0 auto;
  display:none;box-shadow:0 -8px 40px rgba(0,0,0,.2)}
#sheet.on{display:block;animation:up .22s cubic-bezier(.2,.7,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#sheet .grab{width:34px;height:4px;border-radius:2px;background:var(--rule);margin:-8px auto 16px}
#sheet .zh{font-size:23px;font-weight:600;line-height:1.25}
#sheet .en{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--accent-ink);
  display:block;margin:5px 0 12px}
#sheet .def{font-size:16px;line-height:1.75;color:var(--ink-soft);margin:0 0 18px}
#sheet .from{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--muted);
  text-transform:uppercase;margin-bottom:16px}

/* ── 英语板块 ─────────────────────────── */
.ecard{background:var(--surface);border:1px solid var(--rule);border-radius:3px;box-shadow:var(--shadow);
  margin:0 20px 16px;overflow:hidden}
.ehead{padding:20px 20px 0;display:flex;align-items:flex-start;gap:12px}
.ehead .grow{flex:1;min-width:0}
.etype{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--accent-bg);border:1px solid var(--accent);
  padding:2px 8px;border-radius:2px;margin-bottom:11px}
.ecard .en{font-size:27px;line-height:1.2;font-weight:600;letter-spacing:-.01em;margin:0 0 7px;word-break:break-word}
.ecard .zh{font-size:15.5px;line-height:1.65;color:var(--ink-soft);margin:0}
.ebody{padding:16px 20px 20px}
.elbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);margin:18px 0 8px}
.elbl:first-child{margin-top:0}

/* 当前内容版本；与 version.json 比对来发现新一期 */
const BUILD = "2026-09-06";

/* ═══════════ 存储 ═══════════ */
const KEY="dib.v1";
let S={read:{},star:{},starTerm:{},starEng:{},fs:1,theme:"auto"};
try{const r=localStorage.getItem(KEY); if(r) S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

const FS=[15.5,17,19];
function applyFS(){document.documentElement.style.setProperty('--fs',FS[S.fs]+'px')}
function applyTheme(){
  if(S.theme==="auto") document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',S.theme);
}
applyFS(); applyTheme();

/* ═══════════ 工具 ═══════════ */
const $=s=>document.querySelector(s);
const allTerms=()=>ISSUES.flatMap(i=>i.terms.map(t=>({...t,iss:i.id,issTitle:i.title})));
const termMap=()=>{const m={};allTerms().forEach(t=>m[t.zh]=t);return m};
const TM=termMap();

/* [[术语]] 或 [[术语|显示文字]] → 可点击 chip */
function inl(s){
  return String(s).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,k,lbl)=>
    `<button class="term" data-term="${k}">${lbl||k}</button>`);
}
function fmtDate(d){const[,m,dd]=d.split("-");return `${+m} 月 ${+dd} 日`}
function isRead(id){return S.read[id]&&S.read[id].done}
function prog(id){const r=S.read[id];return r?Math.min(1,r.p||0):0}

/* ═══════════ 渲染：今日 ═══════════ */
function renderToday(){
  const i=ISSUES[0];
  $("#todayDate").textContent=i.date.replace(/-/g,".");
  const p=prog(i.id), done=isRead(i.id);
  const C=2*Math.PI*14;
  $("#todayBody").innerHTML=`
    <article class="card">
      <div class="hero">
        <div class="eyebrow">
          <span class="chip">第 ${i.id} 期</span>
          <span class="chip acc">${i.sector}</span>
          <span>${fmtDate(i.date)} · 约 ${i.minutes} 分钟</span>
        </div>
        <h2>${i.title}</h2>
        <p class="deck">${i.deck}</p>
        <div class="btnrow">
          <button class="btn" data-open="${i.id}">${done?"重读本期":(p>0?"继续阅读":"开始阅读")}</button>
          <div class="ringwrap">
            <svg class="ring" viewBox="0 0 34 34"><circle class="bg" cx="17" cy="17" r="14"/>
            <circle class="fg" cx="17" cy="17" r="14" stroke-dasharray="${(p*C).toFixed(1)} ${C.toFixed(1)}"/></svg>
            <span>${Math.round(p*100)}</span>
          </div>
        </div>
      </div>
    </article>
    <article class="card quote"><div class="mini">
      <div class="lbl">能跟人聊的一句话</div><p>${i.takeaway}</p>
    </div></article>
    <article class="card"><div class="mini">
      <div class="lbl">明日预告</div><p>${i.next}</p>
    </div></article>`;
}

/* ═══════════ 渲染：往期 ═══════════ */
function renderArch(f=""){
  const q=f.trim().toLowerCase();
  const hit=ISSUES.filter(i=>{
    if(!q) return true;
    const hay=[i.title,i.sector,i.id,i.deck,...i.terms.map(t=>t.zh+t.en)].join(" ").toLowerCase();
    return hay.includes(q);
  });
  $("#archCount").textContent=`共 ${ISSUES.length} 期`;
  if(!hit.length){$("#archBody").innerHTML=`<div class="empty">没找到「${f}」相关的内容</div>`;return}
  let html="",month="";
  hit.forEach(i=>{
    const m=i.date.slice(0,7);
    if(m!==month){month=m;html+=`<div class="monthlbl">${m.replace("-"," 年 ")} 月</div>`}
    const done=isRead(i.id), p=prog(i.id);
    html+=`<button class="row" data-open="${i.id}">
      <span class="no">${i.id}</span>
      <span><span class="ttl">${i.title}</span>
        <span class="meta"><span>${fmtDate(i.date)}</span><span class="chip">${i.sector}</span>
        <span>${done?"已读":(p>0?Math.round(p*100)+"%":"未读")}</span></span></span>
      <span class="dot ${done?"done":""}"></span></button>`;
  });
  $("#archBody").innerHTML=html;
}

/* ═══════════ 渲染：术语 ═══════════ */
let engMode="today";
function engAll(){return ENGLISH.flatMap(d=>d.items.map(i=>({...i,date:d.date})))}
function engKey(i){return i.date+"|"+i.en}
function ecardHTML(i){
  const k=engKey(i), on=S.starEng[k];
  return `<article class="ecard">
    <div class="ehead">
      <div class="grow"><span class="etype">${i.type}</span>
        <p class="en">${i.en}</p><p class="zh">${i.zh}</p></div>
      <span class="star ${on?"on":""}" data-stareng="${k}">★</span>
    </div>
    <div class="ebody">
      <div class="elbl">什么时候用</div><p class="euse">${i.use}</p>
      <div class="elbl">例句</div>
      ${i.ex.map(([s,t])=>`<div class="eex"><p class="s">${s}</p><p class="t">${t}</p></div>`).join("")}
      <div class="ebox warn"><div class="h">中式英语对照</div>${i.bad}</div>
      <div class="ebox say"><div class="h">听 · 说 · 连读</div>${i.say}</div>
    </div></article>`;
}
function renderEng(){
  const all=engAll();
  $("#engCount").textContent=`共 ${all.length} 条`;
  let list, head="";
  if(engMode==="today"){
    const d=ENGLISH[0];
    head=`<div class="daylbl"><b>${d.date.replace(/-/g,".")}</b><span>今天 3 条</span></div>`;
    list=d.items.map(i=>({...i,date:d.date}));
    $("#engBody").innerHTML=head+list.map(ecardHTML).join("");
    return;
  }
  if(engMode==="star"){
    list=all.filter(i=>S.starEng[engKey(i)]);
    if(!list.length){$("#engBody").innerHTML=`<div class="empty">还没有收藏。点卡片右上角的 ★</div>`;return}
    $("#engBody").innerHTML=`<div class="daylbl"><b>收藏</b><span>${list.length} 条</span></div>`+
      list.map(ecardHTML).join("");
    return;
  }
  /* 往期：和「行业知识 - 往期」同形——默认折叠成一行一条，点开进全屏阅读器 */
  $("#engBody").innerHTML=ENGLISH.map(d=>
    `<div class="daylbl"><b>${d.date.replace(/-/g,".")}</b><span>${d.items.length} 条</span></div>`+
    d.items.map((i,n)=>{
      const k=engKey({...i,date:d.date}), on=!!S.starEng[k];
      return `<button class="row" data-openeng="${k}">
        <span class="no">${String(n+1).padStart(2,"0")}</span>
        <span><span class="eexp">${i.en}</span>
          <span class="meta"><span class="chip">${i.type}</span>${on?"<span>已收藏</span>":""}</span>
          <span class="sub">${i.zh}</span></span>
        <span class="star ${on?"on":""}">★</span></button>`;
    }).join("")).join("");
}

/* ═══════════ 渲染：我的 ═══════════ */
function renderMe(){
  const readN=ISSUES.filter(i=>isRead(i.id)).length;
  const starN=Object.values(S.star).filter(Boolean).length;
  const engN=Object.values(S.starEng).filter(Boolean).length;
  $("#stats").innerHTML=`
    <div><div class="n">${readN}</div><div class="l">已读期数</div></div>
    <div><div class="n">${starN}</div><div class="l">收藏文章</div></div>
    <div><div class="n">${engN}</div><div class="l">收藏英语</div></div>`;
  const starred=ISSUES.filter(i=>S.star[i.id]);
  $("#meBody").innerHTML=`
    <div class="monthlbl">阅读设置</div>
    <div class="set"><span class="k">正文字号</span>
      <span class="sizes">
        <button data-fs="0" aria-pressed="${S.fs===0}">小</button>
        <button data-fs="1" aria-pressed="${S.fs===1}">中</button>
        <button data-fs="2" aria-pressed="${S.fs===2}">大</button>
      </span></div>
    <div class="set"><span class="k">主题</span>
      <span class="sizes">
        <button data-th="auto" aria-pressed="${S.theme==="auto"}">跟随</button>
        <button data-th="light" aria-pressed="${S.theme==="light"}">浅</button>
        <button data-th="dark" aria-pressed="${S.theme==="dark"}">深</button>
      </span></div>
    <div class="monthlbl">收藏的文章</div>
    ${starred.length?starred.map(i=>`<button class="row" data-open="${i.id}">
        <span class="no">${i.id}</span>
        <span><span class="ttl">${i.title}</span><span class="meta"><span>${fmtDate(i.date)}</span>
        <span class="chip">${i.sector}</span></span></span><span></span></button>`).join("")
      :`<div class="empty">还没有收藏。阅读时点右上角的 ★</div>`}
    <div class="monthlbl">关于</div>
    <button class="set" id="btnUpd"><span class="k">检查更新</span><span class="v">内容版本 ${BUILD}</span></button>
    <div class="set"><span class="k">每天一期，早上 8 点自动更新</span><span class="v">v1.2</span></div>
    <div class="set"><span class="k">正文标注「我的粗算 / 解读 / 换算」的是作者推断</span></div>
    <div class="set"><span class="k">其余内容均标注可点击核对的来源</span></div>`;
}

/* ═══════════ 阅读器 ═══════════ */
let cur=null;      /* 正在读的那一期 */
let curEng=null;   /* 正在读的那条英语（两者互斥） */
function blockHTML(b){
  switch(b.t){
    case "p": return `<p>${inl(b.v)}</p>`;
    case "flow": return `<p class="flowline">${b.v.map((x,j)=>
      (j?'<span class="ar">\u2192</span>':'')+inl(x)).join("")}</p>`;
    case "chain": return `<ul class="chain">${b.items.map(([k,v])=>
      `<li><b class="k">${k}</b>${inl(v)}</li>`).join("")}</ul>`;
    case "h4": return `<h4>${inl(b.v)}</h4>`;
    case "ul": return `<ul>${b.v.map(x=>`<li>${inl(x)}</li>`).join("")}</ul>`;
    case "ol": return `<ol>${b.v.map(x=>`<li>${inl(x)}</li>`).join("")}</ol>`;
    case "risk": return `<div class="risk"><div class="lbl">但请注意</div><ol>${
      b.items.map(x=>`<li>${inl(x)}</li>`).join("")}</ol></div>`;
    case "takeaway": return `<div class="tkw"><div class="lbl">${b.lbl}</div><p>${b.v}</p></div>`;
    case "watch": return b.items.map(([n,h,p])=>`<div class="watch"><div class="n">${n}</div>
      <div><h5>${h}</h5><p>${p}</p></div></div>`).join("");
    case "table": return `<div class="tbl"><table><caption>${b.cap} <span style="opacity:.65">· 左右滑动看完整</span></caption>
      <thead><tr>${b.head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${
      b.rows.map(r=>`<tr>${r.map(c=>Array.isArray(c)
        ?`<td class="${c[0]}">${inl(c[1])}</td>`:`<td>${inl(c)}</td>`).join("")}</tr>`).join("")
      }</tbody></table></div>`;
    default: return "";
  }
}
function openIssue(id){
  const i=ISSUES.find(x=>x.id===id); if(!i) return;
  cur=i; curEng=null;
  $("#rId").textContent=`第 ${i.id} 期 · ${i.sector}`;
  $("#rMark").hidden=false;
  $("#rStar").classList.toggle("on",!!S.star[i.id]);
  $("#rMark").classList.toggle("on",isRead(i.id));
  let body=`<header class="rhead"><h2>${i.title}</h2><p class="deck">${i.deck}</p></header>`;
  body+=i.sections.map(s=>`<section class="sec">
    <div class="sechd"><span class="n">${s.n}</span><span class="t">${s.tag}</span></div>
    <h3>${s.h}</h3>${s.q?`<p class="secq"><b>本节回答</b>${inl(s.q)}</p>`:""}${s.blocks.map(blockHTML).join("")}</section>`).join("");
  body+=`<section class="sec"><div class="sechd"><span class="n">§</span><span class="t">本期术语</span></div>
    <h3>${i.terms.length} 条，点开可收藏</h3>${
    i.terms.map(t=>`<button class="gitem" style="padding-left:0;padding-right:0" data-term="${t.zh}">
      <span><span class="zh">${t.zh}</span><span class="en">${t.en}</span>
      <span class="def">${t.def}</span></span>
      <span class="star ${S.starTerm[t.zh]?"on":""}" data-starterm="${t.zh}">★</span></button>`).join("")}</section>`;
  body+=`<div class="srcs"><h4>本期来源 · ${i.sources.length} 项</h4>${
    i.sources.map(s=>`<a href="${s.u}" target="_blank" rel="noopener">
      <span class="d">${s.d}</span><span class="nm">${s.n}</span><br><span style="color:var(--muted);font-size:13px">${s.note}</span></a>`).join("")}</div>`;
  if(i.next) body+=`<div class="endcard"><div class="lbl">明日预告</div><p>${i.next}</p></div>`;
  $("#rBody").innerHTML=body;
  const R=$("#reader"); R.classList.add("on"); R.setAttribute("aria-hidden","false"); R.scrollTop=0;
  document.body.style.overflow="hidden";
  updProg();
}
/* 英语条目的全屏阅读器：复用 #reader 那套 DOM，字段与 ecardHTML 一致 */
function openEng(k){
  const it=engAll().find(x=>engKey(x)===k); if(!it) return;
  cur=null; curEng=it;
  $("#rId").textContent=`${it.date.replace(/-/g,".")} · ${it.type}`;
  $("#rMark").hidden=true;
  $("#rStar").classList.toggle("on",!!S.starEng[k]);
  $("#rProg").style.width="0%";
  $("#rBody").innerHTML=`<header class="rhead">
      <h2 class="eng">${it.en}</h2><p class="deck">${it.zh}</p></header>
    <div class="ebody" style="padding:20px 0 0">
      <div class="elbl">什么时候用</div><p class="euse">${it.use}</p>
      <div class="elbl">例句</div>
      ${it.ex.map(([s,t])=>`<div class="eex"><p class="s">${s}</p><p class="t">${t}</p></div>`).join("")}
      <div class="ebox warn"><div class="h">中式英语对照</div>${it.bad}</div>
      <div class="ebox say"><div class="h">听 · 说 · 连读</div>${it.say}</div>
    </div>`;
  const R=$("#reader"); R.classList.add("on"); R.setAttribute("aria-hidden","false"); R.scrollTop=0;
  document.body.style.overflow="hidden";
}
function closeReader(){
  const R=$("#reader"); R.classList.remove("on"); R.setAttribute("aria-hidden","true");
  document.body.style.overflow=""; cur=null; curEng=null;
  $("#rMark").hidden=false;
  renderToday(); renderArch($("#q").value); renderEng(); renderMe();
}
function updProg(){
  if(!cur) return;
  const R=$("#reader");
  const max=R.scrollHeight-R.clientHeight;
  const p=max>40?Math.min(1,R.scrollTop/max):1;
  $("#rProg").style.width=(p*100)+"%";
  const r=S.read[cur.id]||(S.read[cur.id]={p:0,done:false});
  if(p>r.p) r.p=p;
  if(p>.92&&!r.done){r.done=true;$("#rMark").classList.add("on")}
  save();
}
$("#reader").addEventListener("scroll",()=>{clearTimeout(window._pt);window._pt=setTimeout(updProg,90)},{passive:true});

/* ═══════════ 术语弹层 ═══════════ */
function openTerm(k){
  const t=TM[k]; if(!t) return;
  $("#sheet").innerHTML=`<div class="grab"></div>
    <div class="from">第 ${t.iss} 期 · ${ISSUES.find(i=>i.id===t.iss).title}</div>
    <div class="zh">${t.zh}</div><span class="en">${t.en}</span>
    <p class="def">${t.def}</p>
    <div class="btnrow">
      <button class="btn" data-starterm="${t.zh}">${S.starTerm[t.zh]?"★ 已收藏":"☆ 收藏"}</button>
      <button class="btn ghost" id="sClose">关闭</button>
    </div>`;
  $("#sheet").classList.add("on"); $("#veil").classList.add("on");
}
function closeSheet(){$("#sheet").classList.remove("on");$("#veil").classList.remove("on")}

/* ═══════════ 事件 ═══════════ */
document.addEventListener("click",e=>{
  const t=e.target;

  const st=t.closest("[data-starterm]");
  if(st){e.stopPropagation();const k=st.dataset.starterm;
    S.starTerm[k]=!S.starTerm[k];save();
    if($("#sheet").classList.contains("on"))openTerm(k);
    renderMe();
    if(cur)openIssueKeepScroll();return}

  const tm=t.closest("[data-term]");
  if(tm){openTerm(tm.dataset.term);return}

  const op=t.closest("[data-open]");
  if(op){openIssue(op.dataset.open);return}

  const oe=t.closest("[data-openeng]");
  if(oe){openEng(oe.dataset.openeng);return}

  const go=t.closest("[data-go]");
  if(go){switchTab(go.dataset.go);return}

  const fs=t.closest("[data-fs]");
  if(fs){S.fs=+fs.dataset.fs;save();applyFS();renderMe();return}

  const th=t.closest("[data-th]");
  if(th){S.theme=th.dataset.th;save();applyTheme();renderMe();return}

  const em=t.closest("[data-emode]");
  if(em){engMode=em.dataset.emode;
    document.querySelectorAll("[data-emode]").forEach(b=>b.setAttribute("aria-selected",b===em));
    renderEng();window.scrollTo(0,0);return}

  const se=t.closest("[data-stareng]");
  if(se){const k=se.dataset.stareng;S.starEng[k]=!S.starEng[k];save();renderEng();renderMe();return}

  if(t.closest("#btnUpd")){hardReload();return}
  if(t.closest("#veil")||t.closest("#sClose")){closeSheet();return}
  if(t.closest("#rClose")){closeReader();return}
  if(t.closest("#rStar")&&curEng){const k=engKey(curEng);
    S.starEng[k]=!S.starEng[k];save();
    $("#rStar").classList.toggle("on",!!S.starEng[k]);renderMe();return}
  if(t.closest("#rStar")&&cur){S.star[cur.id]=!S.star[cur.id];save();
    $("#rStar").classList.toggle("on",!!S.star[cur.id]);return}
  if(t.closest("#rMark")&&cur){
    const r=S.read[cur.id]||(S.read[cur.id]={p:0,done:false});
    r.done=!r.done; if(r.done)r.p=1; save();
    $("#rMark").classList.toggle("on",r.done);return}

});
function openIssueKeepScroll(){
  const R=$("#reader"),y=R.scrollTop,id=cur.id;openIssue(id);R.scrollTop=y;
}
$("#q").addEventListener("input",e=>renderArch(e.target.value));

function switchTab(name){
  document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id==="s-"+name));
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.go===name));
  window.scrollTo(0,0);
  if(name==="archive")renderArch($("#q").value);
  if(name==="english")renderEng();
  if(name==="me")renderMe();
  if(name==="today")renderToday();
}

renderToday(); renderArch(); renderEng(); renderMe();

/* ═══════════ 自动更新 ═══════════
   手机主屏幕 App 从后台切回来时，会向 version.json 问一句「有没有新一期」。
   有 → 没在读文章就静默刷新，在读文章就顶部弹一条，不打断阅读。 */
function hardReload(){
  const go=()=>location.replace(location.pathname);
  if(window.caches){
    caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).then(go,go);
  }else go();
}
let updShown=false;
function showUpdBar(){
  if(updShown)return; updShown=true;
  const el=document.getElementById("updbar"); if(el) el.hidden=false;
}
async function checkUpdate(){
  try{
    if(navigator.serviceWorker){
      const reg=await navigator.serviceWorker.getRegistration();
      if(reg) reg.update().catch(function(){});
    }
    const r=await fetch("./version.json?_="+Date.now(),{cache:"no-store"});
    if(!r.ok) return;
    const v=await r.json();
    if(!v||!v.build||v.build===BUILD) return;
    /* 同一个版本一次会话只自动刷新一次，避免 CDN 延迟造成反复重载 */
    const k="dib.upd."+v.build;
    let tried=false; try{tried=!!sessionStorage.getItem(k)}catch(e){}
    const reading=document.getElementById("reader").classList.contains("on");
    if(tried||reading){ showUpdBar(); return; }
    try{sessionStorage.setItem(k,"1")}catch(e){}
    hardReload();
  }catch(e){}
}
document.addEventListener("visibilitychange",function(){ if(!document.hidden) checkUpdate(); });
window.addEventListener("pageshow",function(e){ if(e.persisted) checkUpdate(); });
window.addEventListener("focus",checkUpdate);
setInterval(checkUpdate,30*60*1000);
checkUpdate();

/* 离线支持 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

</script>
